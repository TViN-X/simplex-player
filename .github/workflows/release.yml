name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            platform: win
            artifact: windows
          - label: macOS
            os: macos-latest
            platform: mac
            artifact: macos
          - label: Linux
            os: ubuntu-latest
            platform: linux
            artifact: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder --${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Simplex player ${{ github.ref_name }}
          body: |
            Первые сборки Simplex player для Windows, macOS и Linux.

            - **Windows** — установщик и portable
            - **macOS** — универсальный `.dmg` для Intel и Apple Silicon
            - **Linux** — `.AppImage` и `.deb`

            Сборки не подписаны: Windows SmartScreen и macOS Gatekeeper могут показать предупреждение.
          files: artifacts/**/*
